seed: 42
dataset:
  root: ./dataset
  image_dir: images
  mask_dir: masks
training:
  image_size: 512
  batch_size: 8
  num_workers: 4
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0001
  val_split: 0.2
  checkpoint_dir: ./checkpoints
  best_model_name: best_lraspp.pth
  last_model_name: last_checkpoint.pth
model:
  num_classes: 3
  pretrained_backbone: true
export:
  output_dir: ./exports
  tflite_name: tactile_seg_int8.tflite
  coreml_name: tactile_seg.mlmodel
  input_size: [1, 3, 512, 512]
  representative_dataset_size: 64
